name: Deploy to Cloudflare Workers

on:
  # Pull requests and manual runs validate only; deployment requires an actual branch push.
  pull_request:
    branches: [test, main]
  workflow_dispatch:
  push:
    branches: [test, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "AGENTS.md"

# Cancel obsolete PR checks, but never interrupt a running deployment.
concurrency:
  group: cloudssh-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: github.repository_owner == 'newbietan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Select browser test profile
        id: e2e-profile
        env:
          TEST_E2E_PROFILE: ${{ vars.CLOUDSSH_TEST_E2E }}
        run: node scripts/ci-test-e2e.mjs

      # Fail inexpensive checks and the build before downloading browser binaries.
      - name: Install Playwright browser
        if: steps.e2e-profile.outputs.profile != 'skip' && steps.e2e-profile.outputs.profile != 'chromium'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright Chromium (reduced test profile)
        if: steps.e2e-profile.outputs.profile == 'chromium'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E and accessibility tests
        id: e2e
        if: steps.e2e-profile.outputs.profile != 'skip' && steps.e2e-profile.outputs.profile != 'chromium'
        run: pnpm run test:e2e

      - name: Browser E2E and accessibility tests (Chromium only)
        id: e2e-chromium
        if: steps.e2e-profile.outputs.profile == 'chromium'
        run: pnpm run test:e2e --project=chromium

      - name: Upload browser test reports
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure' || steps.e2e-chromium.outcome == 'success' || steps.e2e-chromium.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Cache compiled FreeRDP assets (test only)
        id: rdp-preview-cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/test' && vars.CLOUDSSH_RDP_TEST_CONFIG != ''
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: tests/interop/rdp-check/preview-cache
          key: cloudssh-rdp-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/interop/rdp-check/prepare-preview.sh', 'tests/interop/rdp-check/preview-cache.mjs') }}

      - name: Build opt-in browser desktop preview (test only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test' && vars.CLOUDSSH_RDP_TEST_CONFIG != ''
        env:
          RDP_CACHE_HIT: ${{ steps.rdp-preview-cache.outputs.cache-hit }}
        run: |
          if [ "$RDP_CACHE_HIT" = 'true' ]; then
            bash tests/interop/rdp-check/prepare-preview.sh --from-cache
          else
            bash tests/interop/rdp-check/prepare-preview.sh
          fi
          pnpm exec wrangler deploy tests/interop/rdp-check/preview-worker.ts --env test --config wrangler.toml --dry-run

      - name: Deploy verified artifact (test)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test' && vars.CLOUDSSH_RDP_TEST_CONFIG == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env test

      - name: Deploy verified artifact with browser desktop preview (test only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test' && vars.CLOUDSSH_RDP_TEST_CONFIG != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RDP_PREVIEW_CONFIG: ${{ vars.CLOUDSSH_RDP_TEST_CONFIG }}
        run: pnpm exec wrangler deploy tests/interop/rdp-check/preview-worker.ts --env test --config wrangler.toml --var "RDP_PREVIEW_CONFIG:$RDP_PREVIEW_CONFIG"

      - name: Deploy verified artifact (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
