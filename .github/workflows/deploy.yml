name: Deploy to Cloudflare Workers

on:
  # test validates changes; main promotes exactly the tested tree. Only pushes deploy.
  pull_request:
    branches: [test, main]
  workflow_dispatch:
  push:
    branches: [test, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "AGENTS.md"

# Cancel obsolete PR checks, but never interrupt a running deployment.
concurrency:
  group: cloudssh-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-test:
    name: Validate test
    if: >-
      github.repository_owner == 'newbietan' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'test') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/test'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2 # Verify that a one-off test push marker does not modify tracked files.

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Select browser test profile
        id: e2e-profile
        run: node scripts/ci-test-e2e.mjs

      # Fail inexpensive checks and the build before downloading browser binaries.
      - name: Install Playwright browser
        if: steps.e2e-profile.outputs.profile != 'skip' && steps.e2e-profile.outputs.profile != 'chromium'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright Chromium (reduced test profile)
        if: steps.e2e-profile.outputs.profile == 'chromium'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E and accessibility tests
        id: e2e
        if: steps.e2e-profile.outputs.profile != 'skip' && steps.e2e-profile.outputs.profile != 'chromium'
        run: pnpm run test:e2e

      - name: Browser E2E and accessibility tests (Chromium only)
        id: e2e-chromium
        if: steps.e2e-profile.outputs.profile == 'chromium'
        run: pnpm run test:e2e --project=chromium

      - name: Upload browser test reports
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure' || steps.e2e-chromium.outcome == 'success' || steps.e2e-chromium.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        with:
          go-version: '1.26.x'
          cache-dependency-path: tools/rdp-peer/go.sum

      - name: Build Windows connector preview (test only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        run: bash scripts/build-rdp-preview.sh

      - name: Deploy verified artifact (test)
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env test src/worker/rdp-preview-entry.ts

  verify-production:
    name: Verify tested release
    if: >-
      github.repository_owner == 'newbietan' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 65 || 5 }}
    permissions:
      actions: read
      contents: read
    outputs:
      tested_sha: ${{ steps.proof.outputs.tested_sha }}
    steps:
      # On PRs this is the prospective merge tree, not just the PR's head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Check for a matching successful full test push
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          # Only a release PR from our own test branch may wait on a matching push.
          WAIT_TEST_HEAD: ${{ github.event_name == 'pull_request' && github.head_ref == 'test' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || '' }}
        run: node scripts/ci-verify-tested-release.mjs

  deploy-production:
    name: Deploy production
    needs: verify-production
    if: github.repository_owner == 'newbietan' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: "11.8.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build verified source
        run: pnpm run build:frontend
      - name: Deploy verified artifact (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  sync-released-test:
    name: Align test with deployed main
    needs: [verify-production, deploy-production]
    if: >-
      github.repository_owner == 'newbietan' && github.repository == 'newbietan/CloudSSH' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Only execute the deployed main commit; never check out the PR head or test.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Sync only the merged and verified test head
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.verify-production.outputs.tested_sha }}
        run: node scripts/ci-sync-released-test.mjs
