name: Sync upstream

on:
  schedule:
    # Runs daily at 04:20 Asia/Shanghai (20:20 UTC).
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # Run only in forks. Scheduled sync is opt-in;
    # manual dispatch remains available without setting the repository variable.
    if: >-
      github.event.repository.fork == true &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_SYNC_UPSTREAM == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync main branch from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! response=$(gh api \
            --method POST \
            "repos/${REPOSITORY}/merge-upstream" \
            -f branch=main 2>"$error_file"); then
            cat "$error_file" >&2
            echo "::error title=上游同步失败::GitHub 无法同步 main 分支，请检查分支冲突或仓库权限。"
            {
              echo "## 上游同步结果"
              echo
              echo "- 状态：同步失败"
              echo "- 建议：检查分支冲突或仓库权限"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ -s "$error_file" ]]; then
            cat "$error_file" >&2
          fi
          rm -f "$error_file"
          trap - EXIT

          merge_type=$(jq -r '.merge_type // "unknown"' <<< "$response")
          base_branch=$(jq -r '.base_branch // "unknown"' <<< "$response")
          detail=""

          case "$merge_type" in
            none)
              result="当前 main 分支未落后于上游，无需同步"
              ;;
            fast-forward)
              result="已成功同步上游更新"
              detail="合并方式：fast-forward"
              ;;
            merge)
              result="已成功同步上游更新"
              detail="合并方式：merge"
              ;;
            *)
              result="GitHub 已完成同步请求"
              detail="合并方式：${merge_type}"
              ;;
          esac

          echo "上游分支：${base_branch}"
          echo "同步结果：${result}"
          if [[ -n "$detail" ]]; then
            echo "$detail"
          fi
          echo "::notice title=上游同步::${result}"

          {
            echo "## 上游同步结果"
            echo
            echo "- 上游分支：\`${base_branch}\`"
            echo "- 状态：${result}"
            if [[ -n "$detail" ]]; then
              echo "- ${detail}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
