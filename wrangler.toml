name = "cloudssh"
main = "src/worker/rdp-entry.ts"
compatibility_date = "2026-07-01"
workers_dev = true

[vars]
DEBUG_MODE = "false"
# 用户无操作空闲超时：默认 30 分钟（支持 30m / 1h / 1800s / 纯数字按秒）；设为 "0" 禁用
IDLE_TIMEOUT = "30m"
# 是否强制登录后才能使用 SSH（GitHub 或单管理员密码会话均满足）；"false" 保持匿名直连可用
REQUIRE_AUTH = "false"

# 构建监视路径：仅源代码变动时触发重新构建
[build]
watch_dir = "."

# 下述注释的配置推荐采用环境变量的形式在 Cloudflare Dashboard 中直接添加：
# - GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET（GitHub OAuth）
# - GITHUB_ALLOWED_USER_IDS（可选，逗号分隔的 GitHub 数字用户 ID 白名单）
# - TURNSTILE_SECRET / TURNSTILE_SITEKEY（Bot 验证；默认不部署，用户自行选择加入。
#   经 Git/CLI 部署的实例建议 SECRET 用 Dashboard Secret 类型——Secret 不受部署覆盖）
# - BASE_URL（OAuth 回调地址，需与实际域名一致）
# - ADMIN_PASSWORD_HASH（单管理员密码登录；`pnpm run hash-password` 生成，非空即启用密码模式，
#   与 GitHub OAuth 互斥且优先级更高；置空/删除即刻退回 GitHub 模式；务必设为 Secret 类型）
# - CF_ACCESS（可选；true 强制要求 ctx.access 已验证身份；请用 hostname-based Access 保护完整域名，
#   Worker 级 Access 不支持 WebSocket。未设置时也自动感知运行时身份，不信任邮箱请求头）

[[durable_objects.bindings]]
name = "SSH_SESSION"
class_name = "SSHSessionDO"

[[durable_objects.bindings]]
name = "USER_DB"
class_name = "UserDBDO"

[[durable_objects.bindings]]
name = "SSH_SHARE"
class_name = "SSHShareDO"

[[durable_objects.bindings]]
name = "MCP_EXECUTION"
class_name = "MCPExecutionDO"

[[durable_objects.bindings]]
name = "RDP_AUTHORITY"
class_name = "RdpAuthorityDO"
# 首次部署及后续迁移通过 migration tag 初始化 SQLite Durable Object 类；
# 已有环境新增或变更 DO 类时必须追加新的、不可复用的 migration tag
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSHSessionDO", "UserDBDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SSHShareDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MCPExecutionDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["RdpAuthorityDO"]
# 浏览器 RDP 资源与 SSH 内联 HTML 分离；避免 Static Assets 路由改变原生 Access 上下文。
[[rules]]
type = "Data"
globs = ["**/*.rdp-bin"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.rdp-text"]
fallthrough = true

# ========== Test 环境 ==========
# test 分支部署到独立 Worker；DO 类绑定相同，但实例与数据和生产环境隔离
# 自定义域名请在 Cloudflare Dashboard 中手动绑定
[env.test]
name = "cloudssh-test"

[env.test.vars]
DEBUG_MODE = "true"
IDLE_TIMEOUT = "30m"
# test 环境默认要求登录（验证强制登录链路）；生产 [vars] 保持 "false" 匿名可用
REQUIRE_AUTH = "true"

[[env.test.durable_objects.bindings]]
name = "SSH_SESSION"
class_name = "SSHSessionDO"

[[env.test.durable_objects.bindings]]
name = "USER_DB"
class_name = "UserDBDO"

[[env.test.durable_objects.bindings]]
name = "SSH_SHARE"
class_name = "SSHShareDO"
[[env.test.durable_objects.bindings]]
name = "MCP_EXECUTION"
class_name = "MCPExecutionDO"
[[env.test.durable_objects.bindings]]
name = "RDP_AUTHORITY"
class_name = "RdpAuthorityDO"
